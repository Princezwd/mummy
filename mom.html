<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Mother's Day Leela Devi</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
      text-align: center;
      color: #d6336c;
    }

    h1 {
      font-size: 3em;
      margin-top: 60px;
      animation: fadeInDown 2s ease-out;
    }

    p {
      font-size: 1.5em;
      margin: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      animation: fadeInUp 2s ease-out;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      padding: 0 20px;
    }

    .gallery img {
      width: 200px;
      height: 250px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .balloon {
      position: absolute;
      width: 40px;
      height: 60px;
      background: #ff6b81;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: fly 10s linear infinite;
      opacity: 0.7;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: #555;
    }

    @keyframes fly {
      0% {
        transform: translateY(100vh) scale(1);
      }
      100% {
        transform: translateY(-150vh) scale(1.2);
      }
    }

    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>Happy Mother's Day ❤️</h1>
  <p>
    Maa, aap mere jeevan ki roshni ho. Aapki muskaan meri taqat hai aur aapka pyaar meri duniya.
    Har din aapko dekh kar lagta hai ki bhagwan ne mujhe sabse badi daulat di hai – aap jaise maa.
    Aapke bina zindagi adhoori hai. Aapke liye jitna bhi kahun, wo kam hoga.
    Love you maa! 💖
  </p>

  <div class="gallery">
    <img src="C:\Users\Princ\Desktop\LOGO\gm.jpg" alt="Mom 1">
    <img src="C:\Users\Princ\Downloads\mom\IMG_20221024_230117.jpg" alt="Mom 2">
    <img src="C:\Users\Princ\Downloads\mom\IMG_20250321_001411.jpg" alt="Mom 3">
    <img src="C:\Users\Princ\Downloads\mom\Screenshot 2025-05-11 014138.jpg" alt="Mom 4">
    
  </div>

  <!-- Heart balloon animation -->
  <script>
    for (let i = 0; i < 20; i++) {
      const balloon = document.createElement('div');
      balloon.classList.add('balloon');
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.animationDelay = Math.random() * 5 + 's';
      balloon.style.background = `hsl(${Math.random() * 360}, 70%, 70%)`;
      document.body.appendChild(balloon);
    }
  </script>
</body>
</html>
